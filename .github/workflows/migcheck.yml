name: migcheck

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  migcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - uses: Genetic-Pottery/migcheck@v0
        with:
          migrate: python migrate.py
          workload: python -m pytest -q
